# 最小 CI 红线。核心语言按 agent 生态选型（候选 TS/Go/Python），三 job 按文件存在自动守卫。
# 原则：分支保护 + 必须绿才能合并；全量检查归 CI，本地只跑与改动匹配的最小集。
name: ci
on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  # L0 三件套：lint / 类型 / 测试。任一失败即红。
  node:
    runs-on: ubuntu-latest
    if: hashFiles('package.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  go:
    runs-on: ubuntu-latest
    if: hashFiles('go.mod') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  python:
    runs-on: ubuntu-latest
    if: hashFiles('sdk/python/pyproject.toml') != '' || hashFiles('pyproject.toml') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .[dev] || pip install -e sdk/python[dev]
      - run: ruff check .
      - run: mypy --strict .
      - run: pytest

  # L1 可选：新增代码覆盖率门禁（需要 diff-cover 或等价工具）
  # coverage:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #       with: { fetch-depth: 0 }
  #     - run: npm run coverage
  #     - run: diff-cover coverage/lcov.info --compare-branch=origin/main --fail-under=100
