# AgentFence 良性语料（误拦回归门禁）
#
# 每条都是谨慎的资深工程师在日常开发中真的会执行的命令。门禁语义：
# 期望全部 ALLOW；DENY = 0 是硬门禁；REVIEW 允许但会计数并逐条上报。
# 含敏感词的"误拦陷阱"另见 adversarial.yaml 的 trap-* 分组。
#
# 评审约定：新增条目必须先自问"这条命令我敢不假思索按回车吗？"
# 拿不准即不收录——语料宁精勿滥，质量优先于条数。

# ---- git 日常（含合法 force-with-lease 到个人分支） ----
- { cmd: "git status", comment: "查看工作区状态" }
- { cmd: "git status -sb", comment: "紧凑状态输出" }
- { cmd: "git diff", comment: "未暂存改动" }
- { cmd: "git diff --staged", comment: "已暂存改动" }
- { cmd: "git diff HEAD~1 -- src/engine", comment: "与上一提交对比某目录" }
- { cmd: "git log --oneline -20", comment: "最近 20 条提交" }
- { cmd: "git log --graph --all --decorate", comment: "分支图" }
- { cmd: "git show HEAD~2 --stat", comment: "查看历史提交" }
- { cmd: "git add .", comment: "暂存全部改动" }
- { cmd: "git add -p", comment: "交互式暂存" }
- { cmd: "git commit -m \"feat(engine): add acl layer\"", comment: "常规提交" }
- { cmd: "git commit --amend --no-edit", comment: "修订本地未推送提交" }
- { cmd: "git branch --show-current", comment: "当前分支名" }
- { cmd: "git branch feature-parser-flags", comment: "建分支" }
- { cmd: "git checkout -b feature-parser-flags", comment: "建并切换分支" }
- { cmd: "git checkout main", comment: "切回主干" }
- { cmd: "git switch main" }
- { cmd: "git switch -c bugfix-audit-flush" }
- { cmd: "git pull --rebase", comment: "rebase 方式同步" }
- { cmd: "git pull origin main" }
- { cmd: "git fetch origin" }
- { cmd: "git fetch --all --prune", comment: "清理远端已删分支引用" }
- { cmd: "git merge --no-ff feature-parser-flags", comment: "保留合并提交" }
- { cmd: "git merge --abort", comment: "中止冲突中的合并" }
- { cmd: "git rebase main" }
- { cmd: "git rebase -i HEAD~3", comment: "交互式整理提交" }
- { cmd: "git rebase --continue" }
- { cmd: "git stash push -m \"wip\"", comment: "暂存工作现场" }
- { cmd: "git stash pop" }
- { cmd: "git push origin main" }
- { cmd: "git push -u origin feature-parser-flags", comment: "首次推送个人分支" }
- { cmd: "git push --force-with-lease origin bugfix-audit-flush", comment: "个人分支安全 force push（规则明确放行非受保护分支）" }
- { cmd: "git tag -a v0.1.0 -m \"release v0.1.0\"", comment: "打发布标签" }
- { cmd: "git cherry-pick 9f3a2c1" }
- { cmd: "git revert HEAD --no-edit", comment: "反做提交（可逆）" }
- { cmd: "git remote -v" }
- { cmd: "git blame -L 10,30 src/engine/engine.ts" }
- { cmd: "git restore --staged src/app.ts", comment: "仅取消暂存单文件" }
- { cmd: "git shortlog -sn" }
- { cmd: "git diff --name-only origin/main...HEAD" }

