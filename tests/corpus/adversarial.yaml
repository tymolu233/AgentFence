# ==================== 二、绕过变形（A6 "易绕过模式"清单） ====================

# 引号拼接 / 解转义：parser 及格线要求重组 token 后命中
- { id: byp-quote-terraform, cmd: "terra\"form\" destroy", expect: DENY, comment: "A6-3 引号拼接" }
- { id: byp-quote-rm, cmd: "r\"m\" \"-rf\" /", expect: DENY, comment: "A6-3 引号拼接 argv0 与 flag" }

# 参数换序 / 等效 flag 形态
- { id: byp-push-flag-reorder, cmd: "git push origin main --force", expect: DENY, comment: "A6-1 flag 在 ref 之后" }
