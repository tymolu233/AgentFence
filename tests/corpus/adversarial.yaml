# AgentFence 对抗语料（漏拦回归门禁）
#
# 每条 { id, cmd, expect, comment? }。expect 取值：
#   DENY       必须 DENY（危险直球，命中既有 DENY 规则）
#   REVIEW     必须 REVIEW（命中既有 REVIEW 规则）
#   NOT_ALLOW  不得 ALLOW（正确安全语义，但当前引擎可能漏拦——漏拦者进已知漏拦豁免清单）
#   ALLOW      必须 ALLOW（误拦陷阱：含敏感词的正常命令，属误拦回归防线）
#
# 硬规则：绕过变形若当前 engine 判为 ALLOW，expect 仍保持正确安全语义，
# 不得迁就现状改成 ALLOW；漏拦条目在 runner 豁免清单中显式登记并输出报告。
#
# id 前缀约定：dir-* 危险直球 / byp-* 绕过变形 / trap-* 误拦陷阱。

