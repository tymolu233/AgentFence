- { id: trap-k8s-delete-pod, cmd: "kubectl delete pod web-0 -n production", expect: ALLOW, comment: "生产环境删单个 pod 属正常运维，规则 allow 样例" }
- { id: trap-docker-image-prune, cmd: "docker image prune -a", expect: ALLOW, comment: "仅清理镜像缓存，规则 allow 样例" }
